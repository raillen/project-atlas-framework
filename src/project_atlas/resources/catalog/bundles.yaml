bundles:
  - id: web-saas
    project_type: web-saas
    agents: [frontend-engineer, backend-engineer, database-engineer, security-reviewer, ux-reviewer]
    skills: [frontend-web, backend-api, database-review, security-web, api-contract-testing, accessibility]
    recipes: [web-feature, security-review, ui-review]
  - id: ecommerce
    project_type: ecommerce
    agents: [frontend-engineer, backend-engineer, database-engineer, security-reviewer, ux-reviewer, release-verifier]
    skills: [frontend-web, backend-api, database-review, security-web, security-api, accessibility]
    recipes: [web-feature, security-review, release]
  - id: api
    project_type: api
    agents: [backend-engineer, database-engineer, security-reviewer]
    skills: [backend-api, database-review, api-contract-testing, security-api]
    recipes: [feature-standard, security-review]
  - id: desktop
    project_type: desktop
    agents: [performance-engineer, security-reviewer, release-verifier]
    skills: [performance-native, security-desktop, release-engineering]
    recipes: [feature-standard, release]
  - id: game
    project_type: game
    agents: [performance-engineer, ux-reviewer]
    skills: [game-runtime, game-ui-testing, playtest-automation, performance-native]
    recipes: [feature-standard, ui-review]
  - id: game-engine
    project_type: game-engine
    agents: [engine-engineer, editor-engineer, renderer-engineer, performance-engineer, networking-engineer, ux-reviewer, compiler-engineer]
    skills: [game-engine-architecture, game-runtime, editor-tooling, rendering-2d, physics-testing, performance-native, benchmarking, playtest-automation]
    recipes: [engine-renderer, architecture-change, release]
  - id: compiler
    project_type: compiler
    agents: [compiler-engineer, performance-engineer]
    skills: [compiler-development, language-tooling, performance-native, benchmarking]
    recipes: [compiler-change, architecture-change]
  - id: library
    project_type: library
    agents: [release-verifier]
    skills: [release-engineering]
    recipes: [feature-standard, release]
  - id: cli
    project_type: cli
    agents: [release-verifier]
    skills: [release-engineering]
    recipes: [feature-standard, release]

risk_rules:
  - id: public-web-security
    when_any: [public-web, web-saas, ecommerce]
    require_skills: [security-web, security-api, security-supply-chain]
  - id: performance-critical
    when_any: [performance-critical, game-engine, compiler]
    require_skills: [benchmarking]
  - id: multiplayer-security
    when_any: [multiplayer, networking]
    require_skills: [security-network, network-testing]
  - id: accessibility-ui
    when_any: [accessibility]
    require_skills: [accessibility, visual-regression]
