name: Release

on:
  push:
    tags:
      - "v0.4.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release artifacts
        run: sh scripts/release.sh
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/atlas-*
            dist/checksums.txt
            dist/release.json
