name: CI

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go format check
        run: |
          diff -u <(echo -n) <(gofmt -d .)
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -v -race ./...
      - name: Build Atlas CLI
        run: go build -o /tmp/atlas ./cmd/atlas
      - name: CLI smoke test
        run: |
          rm -rf /tmp/atlas-smoke
          /tmp/atlas init /tmp/atlas-smoke --profile examples/brasa/project-profile.json --non-interactive
          /tmp/atlas validate /tmp/atlas-smoke
          /tmp/atlas context plan "add a transition template" --path /tmp/atlas-smoke --json
          /tmp/atlas goal new P00-G01 "Foundation" --phase P00 --path /tmp/atlas-smoke
          /tmp/atlas goal list --path /tmp/atlas-smoke
          /tmp/atlas compile --target codex --path /tmp/atlas-smoke
          /tmp/atlas compile --target traycer --path /tmp/atlas-smoke
          /tmp/atlas compile --target opencode --path /tmp/atlas-smoke
          /tmp/atlas connector list
          /tmp/atlas framework-check
          test ! -e /tmp/atlas-smoke/PROJECT_MANIFEST.yaml
          test ! -e /tmp/atlas-smoke/.atlas/project-profile.yaml
