version: 1
project:
  name: Brasa
  type:
    - game-engine
    - desktop
stack:
  languages:
    - csharp
    - ori
  runtime:
    - dotnet
    - sdl3
    - sdl-gpu
    - box2d
  tooling:
    - imgui
    - traycer
features:
  - rendering
  - sprites
  - tilemaps
  - ui
  - editor
  - physics
  - collision
  - lighting
  - postfx
  - multiplayer
  - networking
  - plugins
  - mcp
  - code-editor
  - scripting
  - orchestration
  - ai-assisted-development
quality:
  performance: high
  accessibility: true
  security: high
risk:
  - performance-critical
  - security
ai:
  orchestrator: traycer
  autonomy: agentic
  preferred_models:
    - id: openai/gpt-5.6-sol
      provider: openai
    - id: openai/gpt-5.6-luna
      provider: openai
    - id: deepseek/v4-pro
      provider: deepseek
    - id: deepseek/v4-flash
      provider: deepseek
    - id: minimax/m3
      provider: minimax
    - id: zai/glm-5.2
      provider: zai
    - id: xai/grok-4.5
      provider: xai
    - id: moonshot/kimi-k3
      provider: moonshot
